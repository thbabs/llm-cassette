[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "llm-cassette"
version = "0.0.1"
description = "Record and replay LLM agent SDK and tool calls for offline pytest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Toluwase Babalola", email = "thbabs@users.noreply.github.com" },
]
keywords = ["llm", "testing", "cassette", "openai", "anthropic"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.66,<2"]
anthropic = ["anthropic>=2,<3"]
dev = [
  "mypy>=2.4",
  "pytest>=9.1",
  "ruff>=0.17.1",
  "pre-commit>=4.6.2,<4.7; python_version < '3.11'",
  "pre-commit>=4.7; python_version >= '3.11'",
]

[project.urls]
Homepage = "https://github.com/thbabs/llm-cassette"
Repository = "https://github.com/thbabs/llm-cassette"
Issues = "https://github.com/thbabs/llm-cassette/issues"

[project.entry-points.pytest11]
llm_cassette = "llm_cassette.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cassette"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["llm_cassette"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
